<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      (() => {
        try {
          const stored =
            localStorage.getItem("cogenly:theme-appearance-mode") ??
            localStorage.getItem("cogenly:theme");
          // No stored choice means dark (DEFAULT_APPEARANCE_MODE in src/theme.ts).
          const mode =
            stored === "light" || stored === "dark" || stored === "system" ? stored : "dark";
          const dark =
            mode === "dark" ||
            (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          document.documentElement.dataset.themeSelected = "true";
        } catch {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: #0a0a0a;
        color: #f5f5f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }

      html:not(.dark) body {
        background: #ffffff;
        color: #262626;
      }

      #boot-shell {
        position: relative;
        overflow: hidden;
        display: flex;
        min-height: 100%;
        align-items: center;
        justify-content: center;
        background: inherit;
        color: inherit;
      }

      html[data-theme-selected="true"] #boot-shell {
        background: var(--boot-background);
        color: var(--boot-foreground);
      }

      #boot-shell-card {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 96px;
        height: 96px;
      }

      #boot-shell-logo {
        width: 64px;
        height: 64px;
        object-fit: contain;
      }

      #boot-error {
        display: grid;
        justify-items: center;
        gap: 16px;
        max-width: 600px;
        padding: 24px;
        text-align: center;
      }

      #boot-error p {
        margin: 0;
        overflow-wrap: anywhere;
      }

      #boot-error button {
        padding: 8px 16px;
        border: 1px solid currentColor;
        border-radius: 4px;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
    </style>
    <title>Cogenly (Beta)</title>
  </head>
  <body>
    <div id="root">
      <div id="boot-shell">
        <div id="boot-shell-card" aria-label="Cogenly splash screen">
          <img id="boot-shell-logo" src="/apple-touch-icon.png" alt="Cogenly" />
        </div>
      </div>
    </div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
