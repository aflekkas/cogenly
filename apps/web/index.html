<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/cogenly-mark.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      (() => {
        try {
          const stored =
            localStorage.getItem("cogenly:theme-appearance-mode") ??
            localStorage.getItem("cogenly:theme");
          // No stored choice means dark (DEFAULT_APPEARANCE_MODE in src/theme.ts).
          const mode =
            stored === "light" || stored === "dark" || stored === "system" ? stored : "dark";
          const dark =
            mode === "dark" ||
            (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          document.documentElement.dataset.themeSelected = "true";
        } catch {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        /* The dot's orbit reaches past the glyph's 128 box. */
        overflow: visible;
        margin: 0;
      }

      body {
        background: #0a0a0a;
        color: #f5f5f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }

      html:not(.dark) body {
        background: #ffffff;
        color: #262626;
      }

      /* The boot splash sits outside #root as a full-window ember overlay. The app removes it
         after morphing it into the sidebar mark (src/bootSplash.ts). Fixed brand colors in
         both themes, like the app icon. */
      #boot-shell {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, #ff7b3a, #e63e22);
        color: #ffffff;
      }

      /* Once the inline script has drawn the pixel grid, cleared cells show the app beneath. */
      #boot-shell[data-pixels="ready"] {
        background: transparent;
      }

      #boot-shell-pixels {
        position: absolute;
        top: 0;
        left: 0;
        image-rendering: pixelated;
      }

      /* The glyph's "c" is 72/128 of its box, so this makes it 12vmin tall (80px to 128px). */
      #boot-shell-mark {
        position: relative;
        width: clamp(142px, 21.33vmin, 228px);
        height: clamp(142px, 21.33vmin, 228px);
      }

      #boot-shell-logo {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
      }

      /* Loading loop for the mark (assets/brand/cogenly-mark.svg), 2.4s: the dot steps well
         out of the "c" (orbit radius 58 of 128, 13 clear of its outer edge at 36), circles it
         once, then glides back into the opening on a plain ease-out and rests. The dot and its
         arm are HTML boxes, not SVG, so these transform animations run on the compositor and
         keep moving while the bundle evaluates. Positions are the SVG's 128 box as percents:
         the c's center is (63, 64) and the docked dot is r 9 at (91, 64). */
      #boot-shell-arm {
        position: absolute;
        inset: 0;
        transform-origin: 49.22% 50%;
        animation: boot-mark-orbit 2.4s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }

      #boot-shell-dot {
        position: absolute;
        left: 64.06%;
        top: 42.97%;
        width: 14.06%;
        height: 14.06%;
        border-radius: 50%;
        background: #ffffff;
        animation: boot-mark-reach 2.4s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }

      @keyframes boot-mark-orbit {
        0% {
          transform: rotate(0deg);
        }
        66%,
        100% {
          transform: rotate(-360deg);
        }
      }

      /* 30 of 128 out from the docked radius; the dot is 18 wide, so 166.67% of itself. */
      @keyframes boot-mark-reach {
        0% {
          transform: translateX(0);
        }
        14% {
          transform: translateX(166.67%);
        }
        52% {
          transform: translateX(166.67%);
          animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
        }
        88%,
        100% {
          transform: translateX(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-shell-arm,
        #boot-shell-dot {
          animation: none;
        }
      }

      /* The boot error replaces the splash with the same quiet layout as the app's error
         screen (src/components/AppErrorScreen.tsx); src/lib/bootError.ts builds it. */
      #boot-shell[data-state="error"] {
        background: #0a0a0a;
        color: #f4f4f5;
        font-family:
          "Inter Variable",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      html:not(.dark) #boot-shell[data-state="error"] {
        background: #ffffff;
        color: #27272a;
      }

      #boot-error {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        max-width: 24rem;
        padding: 48px 20px;
        box-sizing: border-box;
        text-align: center;
      }

      #boot-error .boot-error-mark {
        width: 36px;
        height: 36px;
      }

      #boot-error h1 {
        margin: 20px 0 0;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      #boot-error p {
        margin: 4px 0 0;
        font-size: 14px;
        opacity: 0.62;
      }

      #boot-error button {
        height: 28px;
        padding: 0 10px;
        border: 1px solid transparent;
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font-family: inherit;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }

      #boot-error button.primary {
        margin-top: 20px;
        background: #f2f4f7;
        color: #0d0d0f;
      }

      html:not(.dark) #boot-error button.primary {
        background: #141416;
        color: #ffffff;
      }

      #boot-error button.quiet {
        height: 24px;
        margin-top: 6px;
        font-size: 12px;
        opacity: 0.62;
      }

      #boot-error button.quiet:hover,
      #boot-error summary:hover {
        opacity: 1;
      }

      #boot-error button:focus-visible,
      #boot-error summary:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 2px;
      }

      #boot-error details {
        width: 100%;
        margin-top: 16px;
        interpolate-size: allow-keywords;
      }

      #boot-error details::details-content {
        height: 0;
        overflow: hidden;
        transition:
          height 200ms ease,
          content-visibility 200ms allow-discrete;
      }

      #boot-error details[open]::details-content {
        height: auto;
      }

      #boot-error summary {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 6px;
        font-size: 12px;
        opacity: 0.62;
        cursor: pointer;
        list-style: none;
      }

      #boot-error summary::-webkit-details-marker {
        display: none;
      }

      #boot-error summary::before {
        content: "\203A";
        display: inline-block;
        margin-right: 6px;
        transition: transform 200ms ease;
      }

      #boot-error details[open] summary::before {
        transform: rotate(90deg);
      }

      #boot-error pre {
        max-height: 16rem;
        margin: 8px 0 0;
        padding: 8px 12px;
        overflow: auto;
        border: 1px solid rgb(127 127 127 / 0.22);
        border-radius: 8px;
        font:
          12px/1.5 ui-monospace,
          "SF Mono",
          Menlo,
          monospace;
        text-align: left;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        opacity: 0.85;
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-error details::details-content,
        #boot-error summary::before {
          transition: none;
        }
      }
    </style>
    <title>Cogenly (Beta)</title>
  </head>
  <body>
    <div id="boot-shell" role="status" aria-label="Cogenly is loading">
      <canvas id="boot-shell-pixels" aria-hidden="true"></canvas>
      <div id="boot-shell-mark">
        <!-- The white glyph of assets/brand/cogenly-mark.svg, inline so it paints before any
             fetch: the "c" as SVG, the dot as an HTML box so its orbit is composited. -->
        <svg
          id="boot-shell-logo"
          aria-hidden="true"
          viewBox="0 0 128 128"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M79.85 41.64A28 28 0 1 0 79.85 86.36"
            stroke="#FFFFFF"
            stroke-width="16"
            stroke-linecap="round"
          />
        </svg>
        <div id="boot-shell-arm"><div id="boot-shell-dot"></div></div>
      </div>
    </div>
    <script>
      // Pixel ember for the boot splash: an abstract mosaic of big blocks (1x1 and some 2x2
      // cells, about 25 columns) in five quantized ember tones, drawn on one canvas at cell
      // resolution and upscaled with image-rendering: pixelated. While loading, a few blocks
      // at a time step to a neighboring tone (redrawn at 15fps). For the exit,
      // src/bootSplash.ts calls dissolve(): a stop-motion dissolve that rises up the window
      // on evenly spaced 19fps ticks. Blocks are ordered by height plus an ordered dither
      // (a soft band about 30% of the window tall), then spread over the ticks along a
      // trapezoidal density, so each tick clears a small, even batch. A block shows one
      // deeper frame on its tick and is gone after, revealing the app. The glyph pixelates
      // first: on the opening ticks it is redrawn as ever chunkier white blocks, up to the
      // mosaic's own block size (a pre-sized device-resolution canvas), then those blocks step out the
      // same way. Nothing fades. The loop stops when
      // the canvas is removed. Reduced motion draws one static frame.
      (() => {
        const shell = document.getElementById("boot-shell");
        const canvas = document.getElementById("boot-shell-pixels");
        const mark = document.getElementById("boot-shell-mark");
        const context = canvas && canvas.getContext("2d");
        if (!shell || !context) return;
        const FRAME_MS = 66;
        const TICK_MS = 50;
        const TICK_SLACK_MS = 4;
        const GLYPH_STEP_TICKS = 2;
        const TONES = [
          [255, 128, 64],
          [250, 108, 52],
          [243, 89, 42],
          [235, 72, 36],
          [222, 58, 30],
        ];
        // The one in-between frame a block shows before it is gone.
        const DEEP = [196, 48, 26];
        const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
        // Height of the dissolving band, as a share of the window.
        const BAND = 0.3;
        // The glyph's "c" path in its 128 box, and the in-between tone of its white blocks.
        const GLYPH_PATH = new Path2D("M79.85 41.64A28 28 0 1 0 79.85 86.36");
        const GLYPH_FADE = [255, 196, 168];
        const glyphCanvas = document.createElement("canvas");
        const glyphContext = glyphCanvas.getContext("2d");
        Object.assign(glyphCanvas.style, {
          position: "absolute",
          inset: "0",
          visibility: "hidden",
          pointerEvents: "none",
        });
        shell.append(glyphCanvas);
        const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
        let cell = 64;
        let cols = 0;
        let rows = 0;
        let image = null;
        let blocks = [];
        let exit = null;
        let lastFrame = -Infinity;

        function resize() {
          // About 25 columns, never finer than 38px or coarser than 72px blocks.
          cell = Math.max(38, Math.min(72, Math.round(innerWidth / 25)));
          cols = Math.ceil(innerWidth / cell);
          rows = Math.ceil(innerHeight / cell);
          canvas.width = cols;
          canvas.height = rows;
          canvas.style.width = cols * cell + "px";
          canvas.style.height = rows * cell + "px";
          image = context.createImageData(cols, rows);
          // Sized ahead of the exit so its first tick does no allocation.
          const ratio = devicePixelRatio || 1;
          glyphCanvas.width = Math.round(innerWidth * ratio);
          glyphCanvas.height = Math.round(innerHeight * ratio);
          glyphCanvas.style.width = innerWidth + "px";
          glyphCanvas.style.height = innerHeight + "px";
          glyphContext.setTransform(ratio, 0, 0, ratio, 0, 0);
          const taken = new Uint8Array(cols * rows);
          blocks = [];
          for (let y = 0; y < rows; y++) {
            for (let x = 0; x < cols; x++) {
              if (taken[y * cols + x]) continue;
              const merge =
                x + 1 < cols && y + 1 < rows && !taken[y * cols + x + 1] && Math.random() < 0.22;
              const cells = merge
                ? [y * cols + x, y * cols + x + 1, (y + 1) * cols + x, (y + 1) * cols + x + 1]
                : [y * cols + x];
              for (const index of cells) taken[index] = 1;
              const t = rows > 1 ? (y + (merge ? 0.5 : 0)) / (rows - 1) : 0;
              blocks.push({
                cells,
                t,
                // Dissolve order: bottom first, spread over a band by a 4x4 Bayer matrix with
                // a little noise so the dither grid doesn't read.
                order:
                  1 -
                  t +
                  BAND * (0.8 * ((BAYER[(y & 3) * 4 + (x & 3)] + 0.5) / 16) + 0.2 * Math.random()),
                // A jittered quantization gives the tone bands ragged, mosaic edges.
                tone: Math.round(t * (TONES.length - 1) + (Math.random() - 0.5) * 1.1),
                phase: Math.random() * 6.2832,
                speed: 0.0005 + Math.random() * 0.0007,
                step: Math.random() < 0.5 ? -1 : 1,
              });
            }
          }
        }

        // Share of blocks cleared by time f (0..1): eases in over the first 20%, runs steady,
        // and eases out over the last 15% (a trapezoidal rate).
        function clearedBy(f) {
          const rate = 1 / (1 - 0.1 - 0.075);
          if (f < 0.2) return (rate * f * f) / 0.4;
          if (f > 0.85) return 1 - (rate * (1 - f) * (1 - f)) / 0.3;
          return rate * (f - 0.1);
        }

        function timeForShare(u) {
          let low = 0;
          let high = 1;
          for (let i = 0; i < 24; i++) {
            const mid = (low + high) / 2;
            if (clearedBy(mid) < u) low = mid;
            else high = mid;
          }
          return (low + high) / 2;
        }

        function draw(time) {
          const data = image.data;
          for (const block of blocks) {
            let color = exit ? block.frozen : null;
            if (!color) {
              // Each block spends a short slice of its slow cycle one tone off.
              const shifted = !reduceMotion && Math.sin(time * block.speed + block.phase) > 0.94;
              color =
                TONES[
                  Math.min(TONES.length - 1, Math.max(0, block.tone + (shifted ? block.step : 0)))
                ];
              if (exit) block.frozen = color;
            }
            let alpha = 255;
            if (exit) {
              if (exit.tick > block.tick) alpha = 0;
              else if (exit.tick === block.tick) color = DEEP;
            }
            for (const index of block.cells) {
              const offset = index * 4;
              data[offset] = color[0];
              data[offset + 1] = color[1];
              data[offset + 2] = color[2];
              data[offset + 3] = alpha;
            }
          }
          context.putImageData(image, 0, 0);
        }

        // The glyph's pixelation, sampled ahead of the exit (on load and resize) so no step
        // pays for it: the "c" as white blocks at each size, on grids aligned with the mosaic.
        let glyphLevels = null;
        const glyphSizes = () => [Math.round(cell / 4), Math.round(cell / 2), cell];
        const coverageFor = (size) => (size >= cell / 2 ? 0.28 : 0.4);

        function sampleGlyph() {
          if (!mark) return;
          const box = mark.getBoundingClientRect();
          const scale = box.width / 128;
          const left = Math.floor(box.left);
          const top = Math.floor(box.top);
          const side = Math.ceil(box.width) + 1;
          const sample = document.createElement("canvas");
          sample.width = side;
          sample.height = side;
          const pen = sample.getContext("2d");
          pen.setTransform(scale, 0, 0, scale, box.left - left, box.top - top);
          pen.strokeStyle = "#fff";
          pen.lineWidth = 16;
          pen.lineCap = "round";
          pen.stroke(GLYPH_PATH);
          const alpha = pen.getImageData(0, 0, side, side).data;
          glyphLevels = glyphSizes().map((size) => {
            const found = [];
            for (let y = Math.floor(top / size) * size; y < top + side; y += size) {
              for (let x = Math.floor(left / size) * size; x < left + side; x += size) {
                let covered = 0;
                let total = 0;
                for (let sy = Math.max(y, top); sy < Math.min(y + size, top + side); sy += 2) {
                  for (let sx = Math.max(x, left); sx < Math.min(x + size, left + side); sx += 2) {
                    total++;
                    if (alpha[((sy - top) * side + (sx - left)) * 4 + 3] > 127) covered++;
                  }
                }
                if (total && covered / total >= coverageFor(size)) found.push({ x, y, size });
              }
            }
            return found;
          });
        }

        // The dot moves, so its blocks are found at the exit, analytically (a handful).
        function dotBlocks(size, cx, cy, radius) {
          const found = [];
          for (let y = Math.floor((cy - radius) / size) * size; y < cy + radius; y += size) {
            for (let x = Math.floor((cx - radius) / size) * size; x < cx + radius; x += size) {
              let covered = 0;
              for (let i = 0; i < 8; i++) {
                for (let j = 0; j < 8; j++) {
                  const dx = x + (i + 0.5) * (size / 8) - cx;
                  const dy = y + (j + 0.5) * (size / 8) - cy;
                  if (dx * dx + dy * dy <= radius * radius) covered++;
                }
              }
              if (covered / 64 >= coverageFor(size)) found.push({ x, y, size });
            }
          }
          return found;
        }

        // Pixelation steps, GLYPH_STEP_TICKS ticks each: a quarter, half, then a full mosaic
        // block. On the two ticks after, the full-size blocks step out like the mosaic's (one
        // in-between frame, then gone).
        function drawGlyph(tick) {
          if (!exit.glyph) return;
          const step = Math.floor(tick / GLYPH_STEP_TICKS);
          const level = exit.glyph[Math.min(step, exit.glyph.length - 1)];
          const outFrom = exit.glyph.length * GLYPH_STEP_TICKS;
          glyphContext.clearRect(0, 0, innerWidth, innerHeight);
          for (const block of level) {
            const out = outFrom + block.lag;
            if (tick > out) continue;
            const color = tick === out ? GLYPH_FADE : [255, 255, 255];
            glyphContext.fillStyle = `rgb(${color[0]},${color[1]},${color[2]})`;
            glyphContext.fillRect(block.x, block.y, block.size, block.size);
          }
          if (tick === 0) {
            glyphCanvas.style.visibility = "visible";
            mark.style.visibility = "hidden";
          }
          exit.log.push(["glyph", tick, step, Math.round(exit.now * 10) / 10]);
        }

        // Ticks run on a fixed schedule from the exit's first frame, so a late frame never
        // shifts or doubles one. TICK_MS is a whole number of 60Hz (and 120Hz) frames, and a
        // little slack absorbs rAF timestamp jitter, so every tick lasts the same 3 frames.
        function exitTick(time) {
          if (exit.start === null) exit.start = time;
          const tick = Math.floor((time - exit.start + TICK_SLACK_MS) / TICK_MS);
          if (tick === exit.tick) return false;
          exit.tick = tick;
          exit.now = time - exit.start;
          exit.log.push(["tick", tick, Math.round(exit.now * 10) / 10]);
          draw(time);
          drawGlyph(tick);
          if (tick > exit.lastTick) {
            exit.done({ counts: exit.counts, log: exit.log });
            return true;
          }
          return false;
        }

        function tick(time) {
          if (!canvas.isConnected) {
            // The splash was removed, or the boot error replaced it: stop and restore the fallback.
            removeEventListener("resize", onResize);
            delete shell.dataset.pixels;
            return;
          }
          if (exit) {
            if (exitTick(time)) return;
          } else if (time - lastFrame >= FRAME_MS) {
            lastFrame = time;
            draw(time);
          }
          if (!reduceMotion || exit) requestAnimationFrame(tick);
        }

        function onResize() {
          if (exit) return;
          resize();
          draw(performance.now());
          sampleGlyph();
        }

        resize();
        draw(performance.now());
        sampleGlyph();
        shell.dataset.pixels = "ready";
        addEventListener("resize", onResize);
        if (!reduceMotion) requestAnimationFrame(tick);

        window.cogenlyBootSplash = {
          // Runs the exit dissolve; resolves after its last tick with the blocks cleared per
          // tick and a log of when each tick and glyph step drew.
          dissolve(duration) {
            const ticks = Math.max(2, Math.round(duration / TICK_MS));
            const ordered = blocks.slice().sort((a, b) => a.order - b.order);
            const counts = new Array(ticks).fill(0);
            ordered.forEach((block, rank) => {
              const at = timeForShare((rank + 0.5) / ordered.length);
              block.tick = Math.min(ticks - 1, Math.floor(at * ticks));
              counts[block.tick]++;
            });
            // The precomputed "c" levels plus the dot where its orbit has it now.
            let glyph = null;
            if (mark && glyphLevels) {
              const dot = document.getElementById("boot-shell-dot").getBoundingClientRect();
              const radius = (9 * mark.getBoundingClientRect().width) / 128;
              const sizes = glyphSizes();
              glyph = glyphLevels.map((level, index) =>
                level
                  .concat(
                    dotBlocks(
                      sizes[index],
                      dot.left + dot.width / 2,
                      dot.top + dot.height / 2,
                      radius,
                    ),
                  )
                  .map((block) => ({ ...block, lag: Math.random() < 0.5 ? 0 : 1 })),
              );
            }
            return new Promise((resolve) => {
              exit = {
                start: null,
                now: 0,
                log: [],
                tick: -1,
                lastTick: ticks - 1,
                glyph,
                counts,
                done: resolve,
              };
              requestAnimationFrame(tick);
            });
          },
        };
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
