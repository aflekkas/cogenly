<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/cogenly-mark.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      (() => {
        try {
          const stored =
            localStorage.getItem("cogenly:theme-appearance-mode") ??
            localStorage.getItem("cogenly:theme");
          // No stored choice means dark (DEFAULT_APPEARANCE_MODE in src/theme.ts).
          const mode =
            stored === "light" || stored === "dark" || stored === "system" ? stored : "dark";
          const dark =
            mode === "dark" ||
            (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          document.documentElement.dataset.themeSelected = "true";
        } catch {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        /* The dot's orbit reaches past the glyph's 128 box. */
        overflow: visible;
        margin: 0;
      }

      body {
        background: #0a0a0a;
        color: #f5f5f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }

      html:not(.dark) body {
        background: #ffffff;
        color: #262626;
      }

      /* The boot splash sits outside #root as a full-window ember overlay. The app removes it
         after morphing it into the sidebar mark (src/bootSplash.ts). Fixed brand colors in
         both themes, like the app icon. */
      #boot-shell {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, #ff7b3a, #e63e22);
        color: #ffffff;
      }

      /* Once the inline script has drawn the pixel grid, cleared cells show the app beneath. */
      #boot-shell[data-pixels="ready"] {
        background: transparent;
      }

      #boot-shell-pixels {
        position: absolute;
        top: 0;
        left: 0;
        image-rendering: pixelated;
      }

      /* The glyph's "c" is 72/128 of its box, so this makes it 12vmin tall (80px to 128px). */
      #boot-shell-mark {
        position: relative;
        width: clamp(142px, 21.33vmin, 228px);
        height: clamp(142px, 21.33vmin, 228px);
      }

      #boot-shell-logo {
        position: relative;
        display: block;
        width: 100%;
        height: 100%;
        /* The dot's orbit reaches past the glyph's 128 box. */
        overflow: visible;
      }

      /* Loading loop for the mark (assets/brand/cogenly-mark.svg), 2.4s: the dot steps well out of
         the "c" (orbit radius 70 of 128, clear of its outer edge at 36), circles it once, then glides back into the opening on a plain ease-out (no
         overshoot) and rests. Transform-only; it ends when src/bootSplash.ts settles it and
         removes the splash. */
      #boot-shell-logo * {
        transform-box: view-box;
      }

      #boot-shell-logo .boot-mark-arm {
        transform-origin: 63px 64px;
        animation: boot-mark-orbit 2.4s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }

      #boot-shell-logo .boot-mark-dot {
        animation: boot-mark-reach 2.4s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }

      @keyframes boot-mark-orbit {
        0% {
          transform: rotate(0deg);
        }
        66%,
        100% {
          transform: rotate(-360deg);
        }
      }

      @keyframes boot-mark-reach {
        0% {
          transform: translateX(0);
        }
        14% {
          transform: translateX(42px);
        }
        52% {
          transform: translateX(42px);
          animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
        }
        88%,
        100% {
          transform: translateX(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-shell-logo * {
          animation: none;
        }
      }

      #boot-error {
        display: grid;
        justify-items: center;
        gap: 16px;
        max-width: 600px;
        padding: 24px;
        text-align: center;
      }

      #boot-error p {
        margin: 0;
        overflow-wrap: anywhere;
      }

      #boot-error button {
        padding: 8px 16px;
        border: 1px solid currentColor;
        border-radius: 4px;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
    </style>
    <title>Cogenly (Beta)</title>
  </head>
  <body>
    <div id="boot-shell" role="status" aria-label="Cogenly is loading">
      <canvas id="boot-shell-pixels" aria-hidden="true"></canvas>
      <div id="boot-shell-mark">
        <!-- The white glyph of assets/brand/cogenly-mark.svg, inline so it animates before any fetch.
           Its 128 box matches the mark's tile, so scaling it onto the sidebar mark lines up. -->
        <svg
          id="boot-shell-logo"
          aria-hidden="true"
          viewBox="0 0 128 128"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            class="boot-mark-c"
            d="M79.85 41.64A28 28 0 1 0 79.85 86.36"
            stroke="#FFFFFF"
            stroke-width="16"
            stroke-linecap="round"
          />
          <g class="boot-mark-arm">
            <circle class="boot-mark-dot" cx="91" cy="64" r="9" fill="#FFFFFF" />
          </g>
        </svg>
      </div>
    </div>
    <script>
      // Pixel ember for the boot splash: an abstract mosaic of big blocks (1x1 and some 2x2
      // cells, about 25 columns) in five quantized ember tones, drawn on one canvas at cell
      // resolution and upscaled with image-rendering: pixelated. While loading, a few blocks
      // at a time step to a neighboring tone (redrawn at 15fps). For the exit,
      // src/bootSplash.ts calls dissolve(): a stop-motion dissolve that rises up the window
      // on evenly spaced 19fps ticks. Blocks are ordered by height plus an ordered dither
      // (a soft band about 30% of the window tall), then spread over the ticks along a
      // trapezoidal density, so each tick clears a small, even batch. A block shows one
      // deeper frame on its tick and is gone after, revealing the app; the glyph steps out
      // in six opacity steps as the band crosses its rows. The loop stops when
      // the canvas is removed. Reduced motion draws one static frame.
      (() => {
        const shell = document.getElementById("boot-shell");
        const canvas = document.getElementById("boot-shell-pixels");
        const mark = document.getElementById("boot-shell-mark");
        const context = canvas && canvas.getContext("2d");
        if (!shell || !context) return;
        const FRAME_MS = 66;
        const TICK_MS = 52;
        const TONES = [
          [255, 128, 64],
          [250, 108, 52],
          [243, 89, 42],
          [235, 72, 36],
          [222, 58, 30],
        ];
        // The one in-between frame a block shows before it is gone.
        const DEEP = [196, 48, 26];
        const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
        // Height of the dissolving band, as a share of the window.
        const BAND = 0.3;
        const GLYPH_STEPS = 6;
        const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
        let cell = 64;
        let cols = 0;
        let rows = 0;
        let image = null;
        let blocks = [];
        let exit = null;
        let lastFrame = -Infinity;

        function resize() {
          // About 25 columns, never finer than 38px or coarser than 72px blocks.
          cell = Math.max(38, Math.min(72, Math.round(innerWidth / 25)));
          cols = Math.ceil(innerWidth / cell);
          rows = Math.ceil(innerHeight / cell);
          canvas.width = cols;
          canvas.height = rows;
          canvas.style.width = cols * cell + "px";
          canvas.style.height = rows * cell + "px";
          image = context.createImageData(cols, rows);
          const taken = new Uint8Array(cols * rows);
          blocks = [];
          for (let y = 0; y < rows; y++) {
            for (let x = 0; x < cols; x++) {
              if (taken[y * cols + x]) continue;
              const merge =
                x + 1 < cols && y + 1 < rows && !taken[y * cols + x + 1] && Math.random() < 0.22;
              const cells = merge
                ? [y * cols + x, y * cols + x + 1, (y + 1) * cols + x, (y + 1) * cols + x + 1]
                : [y * cols + x];
              for (const index of cells) taken[index] = 1;
              const t = rows > 1 ? (y + (merge ? 0.5 : 0)) / (rows - 1) : 0;
              blocks.push({
                cells,
                t,
                // Dissolve order: bottom first, spread over a band by a 4x4 Bayer matrix with
                // a little noise so the dither grid doesn't read.
                order:
                  1 -
                  t +
                  BAND * (0.8 * ((BAYER[(y & 3) * 4 + (x & 3)] + 0.5) / 16) + 0.2 * Math.random()),
                top: y * cell,
                bottom: (y + (merge ? 2 : 1)) * cell,
                // A jittered quantization gives the tone bands ragged, mosaic edges.
                tone: Math.round(t * (TONES.length - 1) + (Math.random() - 0.5) * 1.1),
                phase: Math.random() * 6.2832,
                speed: 0.0005 + Math.random() * 0.0007,
                step: Math.random() < 0.5 ? -1 : 1,
              });
            }
          }
        }

        // Share of blocks cleared by time f (0..1): eases in over the first 20%, runs steady,
        // and eases out over the last 15% (a trapezoidal rate).
        function clearedBy(f) {
          const rate = 1 / (1 - 0.1 - 0.075);
          if (f < 0.2) return (rate * f * f) / 0.4;
          if (f > 0.85) return 1 - (rate * (1 - f) * (1 - f)) / 0.3;
          return rate * (f - 0.1);
        }

        function timeForShare(u) {
          let low = 0;
          let high = 1;
          for (let i = 0; i < 24; i++) {
            const mid = (low + high) / 2;
            if (clearedBy(mid) < u) low = mid;
            else high = mid;
          }
          return (low + high) / 2;
        }

        function draw(time) {
          const data = image.data;
          for (const block of blocks) {
            let color = exit ? block.frozen : null;
            if (!color) {
              // Each block spends a short slice of its slow cycle one tone off.
              const shifted = !reduceMotion && Math.sin(time * block.speed + block.phase) > 0.94;
              color =
                TONES[
                  Math.min(TONES.length - 1, Math.max(0, block.tone + (shifted ? block.step : 0)))
                ];
              if (exit) block.frozen = color;
            }
            let alpha = 255;
            if (exit) {
              if (exit.tick > block.tick) alpha = 0;
              else if (exit.tick === block.tick) color = DEEP;
            }
            for (const index of block.cells) {
              const offset = index * 4;
              data[offset] = color[0];
              data[offset + 1] = color[1];
              data[offset + 2] = color[2];
              data[offset + 3] = alpha;
            }
          }
          context.putImageData(image, 0, 0);
        }

        // Ticks run on a fixed schedule from the exit's start, so a late frame never shifts
        // or doubles one.
        function exitTick(time) {
          const tick = Math.floor((time - exit.start) / TICK_MS);
          if (tick === exit.tick) return false;
          exit.tick = tick;
          draw(time);
          if (mark) {
            const share = (tick - exit.glyphFrom + 1) / (exit.glyphTo - exit.glyphFrom + 1);
            const step = Math.min(GLYPH_STEPS, Math.max(0, Math.round(share * GLYPH_STEPS)));
            mark.style.opacity = String(1 - step / GLYPH_STEPS);
          }
          if (tick > exit.lastTick) {
            exit.done(exit.counts);
            return true;
          }
          return false;
        }

        function tick(time) {
          if (!canvas.isConnected) {
            // The splash was removed, or the boot error replaced it: stop and restore the fallback.
            removeEventListener("resize", onResize);
            delete shell.dataset.pixels;
            return;
          }
          if (exit) {
            if (exitTick(time)) return;
          } else if (time - lastFrame >= FRAME_MS) {
            lastFrame = time;
            draw(time);
          }
          if (!reduceMotion || exit) requestAnimationFrame(tick);
        }

        function onResize() {
          if (exit) return;
          resize();
          draw(performance.now());
        }

        resize();
        draw(performance.now());
        shell.dataset.pixels = "ready";
        addEventListener("resize", onResize);
        if (!reduceMotion) requestAnimationFrame(tick);

        window.cogenlyBootSplash = {
          // Runs the exit dissolve; resolves after its last tick with the blocks cleared per
          // tick.
          dissolve(duration) {
            const ticks = Math.max(2, Math.round(duration / TICK_MS));
            const ordered = blocks.slice().sort((a, b) => a.order - b.order);
            const counts = new Array(ticks).fill(0);
            ordered.forEach((block, rank) => {
              const at = timeForShare((rank + 0.5) / ordered.length);
              block.tick = Math.min(ticks - 1, Math.floor(at * ticks));
              counts[block.tick]++;
            });
            // The glyph steps out over the ticks that clear the blocks behind it.
            const glyph = mark ? mark.getBoundingClientRect() : null;
            const behind = glyph
              ? blocks.filter((block) => block.bottom > glyph.top && block.top < glyph.bottom)
              : [];
            const glyphTicks = behind.map((block) => block.tick);
            return new Promise((resolve) => {
              exit = {
                start: performance.now(),
                tick: -1,
                lastTick: ticks - 1,
                glyphFrom: glyphTicks.length ? Math.min(...glyphTicks) : 0,
                glyphTo: glyphTicks.length ? Math.max(...glyphTicks) : ticks - 1,
                counts,
                done: resolve,
              };
              requestAnimationFrame(tick);
            });
          },
        };
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
