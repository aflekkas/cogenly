name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Corepack fetches pnpm without asking; jobs have no terminal to answer.
env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      # vp is the lockfile's vite-plus; the viteplus.dev installer fails when npm per-version metadata 502s.
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          package-manager-cache: false
      # Corepack (bundled with Node 24) fetches packageManager's pnpm directly;
      # pnpm/action-setup's npm bootstrap has stalled for minutes.
      - name: Set up pnpm
        id: pnpm
        run: |
          corepack enable pnpm
          echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-${{ runner.arch }}-
      - name: Install dependencies
        run: |
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
          PATH="$GITHUB_WORKSPACE/node_modules/.bin:$PATH" pnpm install --frozen-lockfile
      - run: vp run fmt:check
      - run: vp run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      # vp is the lockfile's vite-plus; the viteplus.dev installer fails when npm per-version metadata 502s.
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          package-manager-cache: false
      # Corepack (bundled with Node 24) fetches packageManager's pnpm directly;
      # pnpm/action-setup's npm bootstrap has stalled for minutes.
      - name: Set up pnpm
        id: pnpm
        run: |
          corepack enable pnpm
          echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-${{ runner.arch }}-
      - name: Install dependencies
        run: |
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
          PATH="$GITHUB_WORKSPACE/node_modules/.bin:$PATH" pnpm install --frozen-lockfile
      - run: vp run --filter @t3tools/desktop ensure:electron
      - run: vp run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      # vp is the lockfile's vite-plus; the viteplus.dev installer fails when npm per-version metadata 502s.
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          package-manager-cache: false
      # Corepack (bundled with Node 24) fetches packageManager's pnpm directly;
      # pnpm/action-setup's npm bootstrap has stalled for minutes.
      - name: Set up pnpm
        id: pnpm
        run: |
          corepack enable pnpm
          echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-${{ runner.arch }}-
      - name: Install dependencies
        run: |
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
          PATH="$GITHUB_WORKSPACE/node_modules/.bin:$PATH" pnpm install --frozen-lockfile
      - run: vp run --filter @t3tools/desktop ensure:electron
      - name: Install native test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config
          node apps/server/node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Test release plan
        run: node --test .github/scripts/release-plan.test.cjs
      - name: Test workspaces
        run: vp run --filter '!@t3tools/monorepo' --concurrency-limit 2 test
