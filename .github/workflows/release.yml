name: Release

# Builds happen only on an explicit dispatch from main; pushes publish nothing.
# Every run promotes to prod behind the production environment gate.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit on main to build: full or short SHA, or main for its HEAD"
        required: true
        default: main
        type: string
      version:
        description: "Prod X.Y.Z override; defaults to apps/desktop/package.json at that commit"
        required: false
        type: string

permissions:
  contents: read

# Corepack fetches pnpm without asking; jobs have no terminal to answer.
env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

# Serialize publication and keep queued runs.
# Adapted from T3 Code's release queue.
concurrency:
  group: release-prod
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    name: Resolve release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Resolve source commit, CI result, and version
        id: plan
        uses: actions/github-script@v8
        env:
          SOURCE_REF: ${{ inputs.ref }}
          VERSION: ${{ inputs.version }}
        with:
          script: |
            if (context.ref !== 'refs/heads/main') throw new Error('Release must be dispatched from main.');
            const { releasePlan, assertProdVersionAdvances, assertSourceRef } = require('./.github/scripts/release-plan.cjs');
            // Validate input before using it as a Git argument.
            const ref = assertSourceRef((process.env.SOURCE_REF || 'main').trim().toLowerCase());
            const git = async (...args) => (await exec.getExecOutput('git', args, { silent: true })).stdout.trim();
            // The checkout is main's HEAD; a short SHA must resolve unambiguously.
            const resolved = await exec.getExecOutput('git', ['rev-parse', '--verify', '--quiet', `${ref === 'main' ? 'HEAD' : ref}^{commit}`], { silent: true, ignoreReturnCode: true });
            const sha = resolved.stdout.trim();
            if (resolved.exitCode !== 0 || !/^[a-f0-9]{40}$/.test(sha)) throw new Error(`${ref} does not resolve to exactly one commit.`);
            const firstParent = (await git('rev-list', '--first-parent', 'HEAD')).split('\n');
            if (!firstParent.includes(sha)) throw new Error(`${sha} is not on main's first-parent history.`);

            // Build only a commit whose own push CI run on main succeeded.
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, { ...context.repo, workflow_id: 'ci.yml', head_sha: sha, event: 'push', per_page: 100 });
            const mainRuns = runs.filter((run) => run.head_branch === 'main');
            if (!mainRuns.some((run) => run.conclusion === 'success')) {
              const seen = mainRuns.map((run) => `${run.html_url} (${run.status}${run.conclusion ? `/${run.conclusion}` : ''})`).join(', ');
              throw new Error(`CI has not succeeded for ${sha} on main. ${seen ? `Runs: ${seen}` : 'No push CI run exists for this commit; only pushed heads are tested.'}`);
            }

            const { data: manifest } = await github.rest.repos.getContent({ ...context.repo, path: 'apps/desktop/package.json', ref: sha });
            const packageVersion = JSON.parse(Buffer.from(manifest.content, 'base64').toString()).version;
            const plan = releasePlan({ packageVersion, version: process.env.VERSION });
            // The latest prod release is also the base for the release notes.
            let previous_tag = '';
            try {
              const { data: latest } = await github.rest.repos.getLatestRelease(context.repo);
              assertProdVersionAdvances(plan.version, latest.tag_name);
              previous_tag = latest.tag_name;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            try {
              await github.rest.repos.getReleaseByTag({ ...context.repo, tag: plan.tag });
              throw new Error(`${plan.tag} already exists. Releases are never overwritten.`);
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            for (const [key, value] of Object.entries({ ...plan, sha, previous_tag })) core.setOutput(key, value);
            core.notice(`prod: ${plan.tag} from ${sha} (CI passed)`);

  desktop:
    name: Build macOS arm64
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: mac
            arch: arm64
            target: dmg
    steps:
      # Packaging reads only HEAD (`git rev-parse`), so a shallow checkout is enough.
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      # vp is the lockfile's vite-plus; the viteplus.dev installer fails when npm per-version metadata 502s.
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          package-manager-cache: false
      # pnpm comes from Node 24's bundled Corepack, cached per packageManager so a hit
      # needs no registry; pnpm/action-setup's npm bootstrap has stalled for minutes.
      - name: Read packageManager
        id: pm
        run: echo "spec=$(node -p 'require("./package.json").packageManager')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/node/corepack
          key: corepack-${{ runner.os }}-${{ runner.arch }}-${{ steps.pm.outputs.spec }}
      - name: Set up pnpm
        id: pnpm
        run: |
          set -euo pipefail
          corepack enable pnpm
          # npm's per-version metadata endpoint intermittently answers 5xx.
          for attempt in 1 2 3 4 5; do
            corepack install && break
            if [[ $attempt == 5 ]]; then exit 1; fi
            sleep $((attempt * 10))
          done
          store="$(pnpm store path --silent)"
          echo "store=$store" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-${{ runner.arch }}-
      - name: Install dependencies
        run: |
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
          PATH="$GITHUB_WORKSPACE/node_modules/.bin:$PATH" pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      # Packaging cargo-builds the resource monitor; reuse its crates and target dir.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/resource-monitor
      - run: vp run --filter @t3tools/desktop ensure:electron
      - name: Stamp package versions
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/update-release-package-versions.ts "$VERSION"
      # Packaging builds the web/server/desktop pipeline itself, as in upstream.
      - name: Build desktop (automatic signing when configured)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--platform '${{ matrix.platform }}' --target '${{ matrix.target }}' --arch '${{ matrix.arch }}' --build-version "$VERSION" --verbose)
          mode=unsigned
          if [[ -n "$CSC_LINK" && -n "$CSC_KEY_PASSWORD" && -n "$APPLE_API_KEY" && -n "$APPLE_API_KEY_ID" && -n "$APPLE_API_ISSUER" ]]; then
            key_path="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$APPLE_API_KEY" > "$key_path"
            chmod 600 "$key_path"
            export APPLE_API_KEY="$key_path"
            args+=(--signed)
            mode=signed-and-notarized
          else
            # Do not discover a partial signing setup or use runner identities.
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          echo "::notice::macOS release mode: $mode"
          vp run dist:desktop:artifact "${args[@]}"
          mkdir -p release-publish
          cp release/*.dmg release/*.zip release/*.blockmap release/latest-mac.yml release-publish/
          printf '%s\n' "$mode" > release-publish/signing-mode.txt
          cd release-publish
          shasum -a 256 ./*.dmg ./*.zip ./*.blockmap ./*.yml > SHA256SUMS
      - name: Verify macOS release payload
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          (cd release-publish && shasum -a 256 -c SHA256SUMS)
          unzip -t "release-publish/Cogenly-$VERSION-arm64.zip" > /dev/null
          grep -F "version: $VERSION" release-publish/latest-mac.yml
          # The same zip is consumed by Squirrel.Mac on signed installs.
          if [[ "$(cat release-publish/signing-mode.txt)" == signed-and-notarized ]]; then
            check_dir="$RUNNER_TEMP/release-signature-check"
            mkdir -p "$check_dir"
            unzip -q "release-publish/Cogenly-$VERSION-arm64.zip" -d "$check_dir"
            app="$(find "$check_dir" -maxdepth 1 -name '*.app' -print -quit)"
            test -n "$app"
            codesign --verify --deep --strict "$app"
            xcrun stapler validate "$app"
            spctl --assess --type execute "$app"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error
          # The DMG and zip are already compressed.
          compression-level: 0

  publish:
    name: Publish release
    needs: [prepare, desktop]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      # History only feeds the first-release notes; commits without trees are enough.
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          filter: tree:0
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-publish
          merge-multiple: true
      - name: Generate notes and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ needs.prepare.outputs.sha }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$PREVIOUS_TAG" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f "tag_name=$TAG" -f "target_commitish=$SHA" \
              -f "previous_tag_name=$PREVIOUS_TAG" --jq .body > release-notes.md
          else
            # GitHub otherwise guesses a previous tag from an old staging prerelease.
            printf 'First prod release.\n\n' > release-notes.md
            git log --first-parent --format="* %s (%h)" "$SHA" >> release-notes.md
          fi
          mode="$(cat release-publish/signing-mode.txt)"
          # shellcheck disable=SC2016
          printf '\nBuild: `%s` • Signing: **%s**\n' "$SHA" "$mode" >> release-notes.md
          if [[ "$mode" == unsigned ]]; then
            printf '\n**Unsigned macOS build.** Gatekeeper may block the first launch of a browser-downloaded copy. Installed apps update themselves in place.\n' >> release-notes.md
          fi
          # shellcheck disable=SC2016
          printf '\nPromoted from main commit `%s` after its CI passed.\n' "$SHA" >> release-notes.md
          rm release-publish/signing-mode.txt
          # Upload to a draft first: a failed upload never exposes a partial feed.
          gh release create "$TAG" --target "$SHA" --title "Cogenly $TAG" --notes-file release-notes.md --latest --draft release-publish/*
          gh release edit "$TAG" --draft=false --prerelease=false --latest
