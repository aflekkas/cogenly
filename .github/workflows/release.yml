name: Release

# Builds happen only on an explicit dispatch from main; pushes publish nothing.
# Every run promotes to prod behind the production environment gate.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit on main to build: full or short SHA, or main for its HEAD"
        required: true
        default: main
        type: string
      version:
        description: "Prod X.Y.Z override; defaults to apps/desktop/package.json at that commit"
        required: false
        type: string

permissions:
  contents: read

# Corepack fetches pnpm without asking; jobs have no terminal to answer.
env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

# Serialize publication and keep queued runs.
# Adapted from T3 Code's release queue.
concurrency:
  group: release-prod
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    name: Resolve release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Resolve source commit, CI result, and version
        id: plan
        uses: actions/github-script@v8
        env:
          SOURCE_REF: ${{ inputs.ref }}
          VERSION: ${{ inputs.version }}
        with:
          script: |
            if (context.ref !== 'refs/heads/main') throw new Error('Release must be dispatched from main.');
            const { releasePlan, assertProdVersionAdvances, assertSourceRef } = require('./.github/scripts/release-plan.cjs');
            // Validate input before using it as a Git argument.
            const ref = assertSourceRef((process.env.SOURCE_REF || 'main').trim().toLowerCase());
            const git = async (...args) => (await exec.getExecOutput('git', args, { silent: true })).stdout.trim();
            // The checkout is main's HEAD; a short SHA must resolve unambiguously.
            const resolved = await exec.getExecOutput('git', ['rev-parse', '--verify', '--quiet', `${ref === 'main' ? 'HEAD' : ref}^{commit}`], { silent: true, ignoreReturnCode: true });
            const sha = resolved.stdout.trim();
            if (resolved.exitCode !== 0 || !/^[a-f0-9]{40}$/.test(sha)) throw new Error(`${ref} does not resolve to exactly one commit.`);
            const firstParent = (await git('rev-list', '--first-parent', 'HEAD')).split('\n');
            if (!firstParent.includes(sha)) throw new Error(`${sha} is not on main's first-parent history.`);

            // Build only a commit whose own push CI run on main succeeded.
            // The head_sha filter is sometimes empty for runs that exist, so also scan recent main pushes.
            const bySha = await github.paginate(github.rest.actions.listWorkflowRuns, { ...context.repo, workflow_id: 'ci.yml', head_sha: sha, event: 'push', per_page: 100 });
            const { data: recent } = await github.rest.actions.listWorkflowRuns({ ...context.repo, workflow_id: 'ci.yml', branch: 'main', event: 'push', per_page: 100 });
            const runs = [...bySha, ...recent.workflow_runs.filter((run) => run.head_sha === sha)];
            const mainRuns = runs.filter((run) => run.head_branch === 'main');
            if (!mainRuns.some((run) => run.conclusion === 'success')) {
              const seen = mainRuns.map((run) => `${run.html_url} (${run.status}${run.conclusion ? `/${run.conclusion}` : ''})`).join(', ');
              throw new Error(`CI has not succeeded for ${sha} on main. ${seen ? `Runs: ${seen}` : 'No push CI run exists for this commit; only pushed heads are tested.'}`);
            }

            const { data: manifest } = await github.rest.repos.getContent({ ...context.repo, path: 'apps/desktop/package.json', ref: sha });
            const packageVersion = JSON.parse(Buffer.from(manifest.content, 'base64').toString()).version;
            const plan = releasePlan({ packageVersion, version: process.env.VERSION });
            // The latest prod release is also the base for the release notes.
            let previous_tag = '';
            try {
              const { data: latest } = await github.rest.repos.getLatestRelease(context.repo);
              assertProdVersionAdvances(plan.version, latest.tag_name);
              previous_tag = latest.tag_name;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            try {
              await github.rest.repos.getReleaseByTag({ ...context.repo, tag: plan.tag });
              throw new Error(`${plan.tag} already exists. Releases are never overwritten.`);
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            for (const [key, value] of Object.entries({ ...plan, sha, previous_tag })) core.setOutput(key, value);
            core.notice(`prod: ${plan.tag} from ${sha} (CI passed)`);

  desktop:
    name: Build macOS arm64
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: mac
            arch: arm64
            target: dmg
    steps:
      # Packaging reads only HEAD (`git rev-parse`), so a shallow checkout is enough.
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      # vp is the lockfile's vite-plus; the viteplus.dev installer fails when npm per-version metadata 502s.
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          package-manager-cache: false
      # pnpm comes from Node 24's bundled Corepack, cached per packageManager so a hit
      # needs no registry; pnpm/action-setup's npm bootstrap has stalled for minutes.
      - name: Read packageManager
        id: pm
        run: echo "spec=$(node -p 'require("./package.json").packageManager')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/node/corepack
          key: corepack-${{ runner.os }}-${{ runner.arch }}-${{ steps.pm.outputs.spec }}
      - name: Set up pnpm
        id: pnpm
        run: |
          set -euo pipefail
          corepack enable pnpm
          # npm's per-version metadata endpoint intermittently answers 5xx.
          for attempt in 1 2 3 4 5; do
            corepack install && break
            if [[ $attempt == 5 ]]; then exit 1; fi
            sleep $((attempt * 10))
          done
          store="$(pnpm store path --silent)"
          echo "store=$store" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-${{ runner.arch }}-
      - name: Install dependencies
        run: |
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
          PATH="$GITHUB_WORKSPACE/node_modules/.bin:$PATH" pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      # Packaging cargo-builds the resource monitor; reuse its crates and target dir.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/resource-monitor
      # The dictation helper needs the macOS 26 SDK; macos-15 defaults to Xcode 16.
      # Only swiftc uses it (via COGENLY_SPEECH_DEVELOPER_DIR), not the rest of the build.
      - name: Select Xcode 26 for the speech helper
        shell: bash
        run: |
          set -euo pipefail
          xcode="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"
          echo "COGENLY_SPEECH_DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$xcode/Contents/Developer" xcrun swiftc --version
      - run: vp run --filter @t3tools/desktop ensure:electron
      - name: Stamp package versions
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/update-release-package-versions.ts "$VERSION"
      # Packaging builds the web/server/desktop pipeline itself, as in upstream.
      - name: Build desktop (automatic signing when configured)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--platform '${{ matrix.platform }}' --target '${{ matrix.target }}' --arch '${{ matrix.arch }}' --build-version "$VERSION" --verbose)
          mode=unsigned
          if [[ -n "$CSC_LINK" && -n "$CSC_KEY_PASSWORD" && -n "$APPLE_API_KEY" && -n "$APPLE_API_KEY_ID" && -n "$APPLE_API_ISSUER" ]]; then
            key_path="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$APPLE_API_KEY" > "$key_path"
            chmod 600 "$key_path"
            export APPLE_API_KEY="$key_path"
            args+=(--signed)
            mode=signed-and-notarized
          else
            # Do not discover a partial signing setup or use runner identities.
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          echo "::notice::macOS release mode: $mode"
          vp run dist:desktop:artifact "${args[@]}"
          mkdir -p release-publish
          cp release/*.dmg release/*.zip release/*.blockmap release/latest-mac.yml release-publish/
          printf '%s\n' "$mode" > release-publish/signing-mode.txt
          cd release-publish
          shasum -a 256 ./*.dmg ./*.zip ./*.blockmap ./*.yml > SHA256SUMS
      - name: Verify macOS release payload
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          (cd release-publish && shasum -a 256 -c SHA256SUMS)
          unzip -t "release-publish/Cogenly-$VERSION-arm64.zip" > /dev/null
          grep -F "version: $VERSION" release-publish/latest-mac.yml
          # The same zip is consumed by Squirrel.Mac on signed installs.
          if [[ "$(cat release-publish/signing-mode.txt)" == signed-and-notarized ]]; then
            check_dir="$RUNNER_TEMP/release-signature-check"
            mkdir -p "$check_dir"
            unzip -q "release-publish/Cogenly-$VERSION-arm64.zip" -d "$check_dir"
            app="$(find "$check_dir" -maxdepth 1 -name '*.app' -print -quit)"
            test -n "$app"
            codesign --verify --deep --strict "$app"
            xcrun stapler validate "$app"
            spctl --assess --type execute "$app"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error
          # The DMG and zip are already compressed.
          compression-level: 0

  cli:
    name: Build Linux ${{ matrix.arch }} server
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Read packageManager
        id: pm
        run: echo "spec=$(node -p 'require("./package.json").packageManager')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/node/corepack
          key: corepack-${{ runner.os }}-${{ runner.arch }}-${{ steps.pm.outputs.spec }}
      - name: Set up pnpm
        id: pnpm
        run: |
          set -euo pipefail
          corepack enable pnpm
          for attempt in 1 2 3 4 5; do
            corepack install && break
            if [[ $attempt == 5 ]]; then exit 1; fi
            sleep $((attempt * 10))
          done
          store="$(pnpm store path --silent)"
          echo "store=$store" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-${{ runner.arch }}-
      # The server archive never contains Electron, so skip its binary download.
      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
          # The archive's runtime externals install with this Node and its Corepack pnpm.
          echo "WORKSPACE_NODE_BIN=$(dirname "$(command -v node)")" >> "$GITHUB_ENV"
          PATH="$GITHUB_WORKSPACE/node_modules/.bin:$PATH" pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/resource-monitor
      - name: Stamp package versions
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/update-release-package-versions.ts "$VERSION"
      # Web client into apps/server/dist/client, plus the resource monitor.
      - name: Build server, web client, and resource monitor
        run: |
          set -euo pipefail
          vp run --filter t3 build
          vp run build:resource-monitor
          mkdir -p "$RUNNER_TEMP/resource-monitor"
          cp native/resource-monitor/target/release/t3-resource-monitor "$RUNNER_TEMP/resource-monitor/"
      # `--build-sea` needs Node 25.7+ on the host. The executable embeds the
      # Node pinned in apps/server/vite.config.ts (SEA_NODE_VERSION) either way.
      - uses: actions/setup-node@v6
        with:
          node-version: 26.8.2
          package-manager-cache: false
      - name: Build the single-executable archive
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          node apps/server/scripts/cli.ts build-exe --target "linux-${{ matrix.arch }}"
          # Staging and smoke-testing run on the workspace Node, as the macOS packaging does.
          export PATH="$WORKSPACE_NODE_BIN:$PATH"
          node scripts/build-cli-archive.ts --platform linux --arch '${{ matrix.arch }}' \
            --version "$VERSION" --output-dir release-cli --resource-monitor-dir "$RUNNER_TEMP/resource-monitor"
          archive="t3-$VERSION-linux-${{ matrix.arch }}.tar.gz"
          test -f "release-cli/$archive"
          # Runs the extracted executable with an empty PATH: --version, then a real serve.
          node scripts/smoke-cli-archive.ts --archive "release-cli/$archive" --expect-version "$VERSION"
          (cd release-cli && sha256sum "$archive" > "SHA256SUMS.linux-${{ matrix.arch }}" && sha256sum -c "SHA256SUMS.linux-${{ matrix.arch }}")
      - uses: actions/upload-artifact@v4
        with:
          name: cli-linux-${{ matrix.arch }}
          path: release-cli/*
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish release
    needs: [prepare, desktop, cli]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      # History feeds the release notes; commits without trees are enough.
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          filter: tree:0
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-publish
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: release-publish
          merge-multiple: true
      # One SHA256SUMS for the whole release, covering the Mac and Linux assets.
      - name: Merge and verify checksums
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          cd release-publish
          node -e 'const fs = require("node:fs");
              const { mergeChecksums, assertReleaseAssets } = require(process.argv[1]);
              const parts = fs.readdirSync(".").filter((name) => /^SHA256SUMS(\.|$)/.test(name)).sort();
              const merged = mergeChecksums(parts.map((name) => fs.readFileSync(name, "utf8")));
              assertReleaseAssets(merged, process.env.VERSION);
              for (const name of parts) fs.rmSync(name);
              fs.writeFileSync("SHA256SUMS", merged);' "$GITHUB_WORKSPACE/.github/scripts/release-plan.cjs"
          sha256sum -c SHA256SUMS
          cat SHA256SUMS
      - name: Generate notes and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ needs.prepare.outputs.sha }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
        shell: bash
        run: |
          set -euo pipefail
          # Curated notes from the commit subjects since the last prod release. The
          # app's Updates popover shows the bullets and stops at "## Build".
          range="$SHA"
          if [[ -n "$PREVIOUS_TAG" ]]; then range="$PREVIOUS_TAG..$SHA"; fi
          git log --first-parent --format=%s "$range" \
            | node -e 'const { renderReleaseNotes } = require("./.github/scripts/release-plan.cjs");
                let input = "";
                process.stdin.on("data", (chunk) => (input += chunk));
                process.stdin.on("end", () => process.stdout.write(renderReleaseNotes(input.split("\n"))));' \
            > release-notes.md
          mode="$(cat release-publish/signing-mode.txt)"
          {
            printf '\n## Build\n\n'
            # shellcheck disable=SC2016
            printf 'Main commit `%s` • Signing: **%s**\n' "$SHA" "$mode"
            # shellcheck disable=SC2016
            printf '\nLinux server: `t3-%s-linux-x64.tar.gz` and `t3-%s-linux-arm64.tar.gz`, checksummed in `SHA256SUMS`.\n' "${TAG#v}" "${TAG#v}"
            if [[ "$mode" == unsigned ]]; then
              printf '\n**Unsigned macOS build.** Gatekeeper may block the first launch of a browser-downloaded copy. Installed apps update themselves in place.\n'
            fi
            if [[ -n "$PREVIOUS_TAG" ]]; then
              printf '\nFull changelog: https://github.com/%s/compare/%s...%s\n' "$GITHUB_REPOSITORY" "$PREVIOUS_TAG" "$TAG"
            fi
          } >> release-notes.md
          rm release-publish/signing-mode.txt
          # Upload to a draft first: a failed upload never exposes a partial feed.
          gh release create "$TAG" --target "$SHA" --title "Cogenly $TAG" --notes-file release-notes.md --latest --draft release-publish/*
          gh release edit "$TAG" --draft=false --prerelease=false --latest
